# Daily Health Data README Sync
#
# Runs every day at 06:00 South Africa / Egypt time (UTC+2), i.e. 04:00 UTC.
# It scans data/, recomputes the daily health metrics and syncs the result to
# README.md so academic researchers always see up-to-date summaries.

name: Daily Health Data README Sync

on:
  schedule:
    # 04:00 UTC == 06:00 UTC+2 (South Africa / Egypt)  [daily]
    - cron: '0 4 * * *'
  workflow_dispatch: {}   # allow manual trigger for testing

permissions:
  contents: write         # allow the workflow to push README updates

concurrency:
  group: daily-readme-sync
  cancel-in-progress: true

jobs:
  sync-readme:
    name: Sync health data summary to README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external dependencies required for the core script

      - name: Run daily health data summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/daily_health_summary.py

      - name: Commit & push updated README
        run: |
          git config user.name "health-data-sync-bot"
          git config user.email "health-data-sync-bot@users.noreply.github.com"
          git add README.md reports/
          if git diff --cached --quiet; then
            echo "No changes to commit - data unchanged since last sync."
          else
            git commit -m "daily(readme): update health data summary $(date +%F)"
            git push
            echo "Pushed daily README update."
          fi
